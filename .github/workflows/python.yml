name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m compileall -q src examples tests
      - run: python -m unittest discover -s tests -v
      - run: python examples/offline_demo.py

      - run: python examples/ch04_agent_loop.py
      - run: python examples/ch05_run_lifecycle.py
      - run: python examples/ch06_gateway_demo.py
      - run: python examples/ch07_tool_runtime.py
      - run: python examples/ch08_context_lab.py
      - run: python examples/ch09_memory_lab.py
      - run: python examples/ch10_planning_lab.py
      - run: python examples/ch11_workflow_lab.py
      - run: python examples/ch12_durable_lab.py
      - run: python examples/ch13_research_lab.py
      - run: python examples/ch14_repository_map.py
      - run: python examples/ch15_coding_lab.py
      - run: python examples/ch17_multi_agent_lab.py
      - run: python examples/ch18_sandbox_lab.py

  browser:
    name: Chromium integration (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUN_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_ch16_browser.py -v
      - run: python examples/ch16_browser_lab.py
