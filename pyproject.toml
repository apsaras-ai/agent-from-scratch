[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent-from-scratch"
version = "0.2.0"
description = "Educational minimal agent runtime built from first principles"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]
browser = ["playwright==1.57.0"]

[tool.setuptools.packages.find]
where = ["src"]
